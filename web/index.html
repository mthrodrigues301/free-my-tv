<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free My TV</title>
<link rel="stylesheet" href="home.css?v=170">
<link rel="stylesheet" href="settings-ui.css?v=170">
</head>
<body>
<script>
  // The look the home screen last had, before anything is drawn, so a night start doesn't flash the day one first.
  try {
    if (localStorage.getItem('fmtv.night') === 'true') {
      document.documentElement.style.background = '#0B0B0D';
      document.body.className = 'night';
    }
  } catch (e) {}
</script>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad night"></div>
    <canvas id="bgA" width="48" height="27"></canvas>
    <canvas id="bgB" width="48" height="27"></canvas>
    <div class="veil"></div>
    <div class="lift"></div>
  </div>
  <div id="home" class="layer">
    <div id="top" class="layer">
      <h1 id="title"></h1>
      <div id="tabs"></div>
      <div id="quotes"></div>
      <div id="buttons"></div>
      <div id="cards"></div>
      <div id="clock"><span class="time"></span><span class="date"></span></div>
    </div>
    <div id="platter"></div>
    <div id="tiles"></div>
  </div>
  <div id="drawer" class="layer"></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="saver" class="layer"></div>
  <div id="photo-viewer" role="dialog" aria-label="Photos"><div id="photo-soft-background"></div><img alt=""><button id="photo-close"></button><button id="photo-prev">‹</button><button id="photo-next">›</button><div id="photo-count"></div></div>
  <div id="toast"></div>
</div>
<script src="config.js?v=170"></script>
<script src="coins.js?v=170"></script>
<script src="i18n.js?v=170"></script>
<script src="strings.js?v=170"></script>
<script src="tv.js?v=170"></script>
<script src="zones.js?v=170"></script>
<script src="recommendation-filters.js?v=170"></script>
<script src="data.js?v=170"></script>
<script src="settings-ui.js?v=170"></script>
<script src="recommendation-settings.js?v=170"></script>
<script src="city.js?v=170"></script>
<script src="widgets.js?v=170"></script>
<script src="metrics.js?v=170"></script>
<script src="shelf-order.js?v=170"></script>
<script src="photos-data.js?v=170"></script>
<script src="appearance.js?v=170"></script>
<script src="title-details.js?v=170"></script>
<script src="photo-layout.js?v=170"></script>
<script src="photo-gallery.js?v=170"></script>
<script src="media-search.js?v=170"></script>
<script src="text-setting.js?v=170"></script>
<script src="screen-rest.js?v=170"></script>
<script src="home.js?v=170"></script>
</body>
</html>
